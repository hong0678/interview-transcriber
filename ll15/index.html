<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>15기 운영진 면접</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 고정 조작줄(지원자 탭·받아쓰기) → 섹션별 질문 카드(질문·답변·꼬리질문) → 종합 메모 */
:root{
  --bg:#f3f5f7; --surface:#fff; --fg:#18202b; --muted:#5f6b7a; --line:#dbe1e8; --soft:#eef1f5;
  --accent:#e8742a; --accent-soft:#fdeee3; --rec:#c93b3b; --rec-soft:#fbe5e5; --ok:#23845a; --ok-soft:#e1f2ea;
  --hong:#2f63c0; --jo:#8a44b8; --go:#1f8578;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11151b; --surface:#191f27; --fg:#e6ebf1; --muted:#98a3b2; --line:#2b333e; --soft:#212831;
  --accent:#f29a5c; --accent-soft:#3a2617; --rec:#ef7f7f; --rec-soft:#3b1f20; --ok:#6dcb9e; --ok-soft:#173027;
  --hong:#82a8f0; --jo:#c493e6; --go:#6ccbbd; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* 잠금 화면 */
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:12px;width:min(380px,100%)}
.lock h1{margin:0;font-size:20px}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock input[type=password]{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.lock .row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.lock .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:10px}
.lock .err{color:var(--rec);font-size:14px}

/* 상단 조작줄 */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:grid;gap:8px}
.r1,.r2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:700;font-size:15px;margin-right:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border-radius:99px;padding:5px 14px}
.tabs button[aria-current="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg);font-weight:700}
.sp{flex:1}
#rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700;padding:7px 16px}
#rec.on{background:var(--rec-soft);color:var(--rec)}
.status{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.on-air .dot{background:var(--rec);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.on-air .dot{animation:none}}
.timer{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:14px}
.r2 label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg{font-size:13px;color:var(--rec)}

main{max-width:960px;margin:0 auto;padding:20px 16px 160px;display:grid;gap:28px}
.cand-h{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.cand-h h1{margin:0;font-size:26px}
.cand-h span{color:var(--muted);font-size:14px}
.help{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.help kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
section.sec{display:grid;gap:10px}
section.sec h2{margin:0;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.say{color:var(--muted);font-size:14.5px;padding:2px 4px 2px 14px;border-left:2px solid var(--line)}

/* 질문 카드 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.q.mine{border-left:4px solid var(--accent)}
.q.done{background:var(--soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.no{font-family:var(--mono);font-weight:600}
.who{font-weight:700;border-radius:99px;padding:0 9px;color:#fff;font-size:12px}
.who.홍{background:var(--hong)} .who.조{background:var(--jo)} .who.고{background:var(--go)}
.tag{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 8px}
.chk{margin-left:auto;display:flex;gap:4px;align-items:center;color:var(--muted);cursor:pointer}
textarea{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;resize:none;padding:4px 6px;line-height:1.55;field-sizing:content;min-height:2em;overflow:hidden}
textarea:hover{border-color:var(--line)}
textarea:focus{border-color:var(--accent);background:var(--bg);outline:none}
.qt{font-weight:500;font-size:16px}
.aw{border-radius:8px;background:var(--bg);padding:4px;display:grid;gap:2px;border:1px solid transparent}
.aw .ans{font-size:15px;min-height:2.4em}
.aw.active{border-color:var(--rec);background:var(--rec-soft)}
.aw.active::before{content:"● 여기에 받아쓰는 중";font-family:var(--mono);font-size:11px;color:var(--rec);padding:2px 6px}
.live{color:var(--muted);font-size:14.5px;padding:0 6px}
.live:empty{display:none}
.fus{display:grid;gap:8px;padding-left:14px;border-left:2px dashed var(--line)}
.fu{display:grid;gap:4px}
.fu .meta .lbl{color:var(--accent);font-weight:700}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{font-size:13px;padding:4px 10px}
.x{border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 6px}
.addq{justify-self:start;font-size:13px;color:var(--muted);border-style:dashed}
.memo textarea{background:var(--surface);border:1px solid var(--line);min-height:6em}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20}
</style>
</head>
<body>

<div class="lock" id="lock">
  <form id="lockform">
    <h1>15기 운영진 면접</h1>
    <p>면접 질문지가 들어 있어서 잠겨 있어요. 운영진에게 받은 비밀번호를 넣어주세요.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <label class="row"><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button class="go" type="submit">열기</button>
    <div class="err" id="lockerr" hidden>비밀번호가 맞지 않아요.</div>
  </form>
</div>

<div id="app" hidden>
  <div class="top"><div class="top-in">
    <div class="r1">
      <span class="brand">15기 면접</span>
      <div class="tabs" id="tabs" role="tablist"></div>
      <span class="sp"></span>
      <span class="timer" id="timer" title="이 지원자 받아쓰기를 처음 시작한 뒤 지난 시간">00:00</span>
      <span class="status" id="status"><span class="dot"></span><span id="status-t">대기 중</span></span>
      <button id="rec" type="button">● 받아쓰기 시작</button>
    </div>
    <div class="r2">
      <label for="me">내 질문 강조
        <select id="me"><option value="">없음</option><option>홍</option><option>조</option><option>고</option></select>
      </label>
      <span class="sp"></span>
      <button id="copy" type="button">복사</button>
      <button id="savetxt" type="button">텍스트 저장</button>
      <button id="backup" type="button">기록 파일 내보내기</button>
      <button id="importbtn" type="button">기록 파일 합치기</button>
      <input id="importfile" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="msg" id="err" hidden></div>
  </div></div>

  <main id="main"></main>
</div>

const STORE = "ll15-interview-v1", PWKEY = "ll15-pw", MEKEY = "ll15-me";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };

let BASE = [], S = { cands: {} }, cur = null, target = null, running = false, recog = null;

/* ---------- 잠금 해제 ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BLOB.s), iterations: BLOB.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(pw, remember) {
  try { BASE = await decrypt(pw); } catch { return false; }
  if (remember) ls.set(PWKEY, pw);
  boot();
  return true;
}
$("lockform").addEventListener("submit", async e => {
  e.preventDefault();
  $("lockerr").hidden = true;
  if (!await tryUnlock($("pw").value, $("remember").checked)) $("lockerr").hidden = false;
});

/* ---------- 상태 ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function fresh(c) {
  const x = clone(c);
  x.sections.forEach(s => s.items.forEach(it => { if (it.t === "q") { it.answer = ""; it.done = false; it.fu.forEach(f => f.answer = ""); } }));
  return { sections: x.sections, memo: "", startedAt: null };
}
function load() {
  try { S = JSON.parse(ls.get(STORE) || "") || { cands: {} }; } catch { S = { cands: {} }; }
  if (!S.cands) S.cands = {};
  BASE.forEach(c => { if (!S.cands[c.id]) S.cands[c.id] = fresh(c); });
}
let saveT = null;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => ls.set(STORE, JSON.stringify(S)), 250); };
const C = () => S.cands[cur];
const nameOf = id => BASE.find(c => c.id === id)?.name || "";

// id → {obj, parent} 찾기
function find(id) {
  for (const s of C().sections) for (const it of s.items) {
    if (it.id === id) return { obj: it, parent: null, sec: s };
    for (const f of it.fu || []) if (f.id === id) return { obj: f, parent: it, sec: s };
  }
  return null;
}
function order() {
  const out = [];
  C().sections.forEach(s => s.items.forEach(it => { if (it.t === "q") { out.push(it.id); it.fu.forEach(f => out.push(f.id)); } }));
  return out;
}
const newId = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- 화면 ---------- */
function boot() {
  $("lock").hidden = true; $("app").hidden = false;
  load();
  $("me").value = ls.get(MEKEY) || "";
  $("tabs").innerHTML = BASE.map((c, i) => `<button type="button" role="tab" data-c="${c.id}">${esc(c.name)}</button>`).join("");
  const h = parseInt(location.hash.slice(1), 10);
  open(BASE[(h >= 1 && h <= BASE.length) ? h - 1 : 0].id);
  setInterval(tick, 1000);
}

function open(cid) {
  if (running) stop();
  cur = cid; target = null;
  const i = BASE.findIndex(c => c.id === cid);
  history.replaceState(null, "", "#" + (i + 1));
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.c === cid));
  document.title = `${nameOf(cid)} · 15기 운영진 면접`;
  render(); tick(); window.scrollTo(0, 0);
}

function whoBadge(w) { return w ? `<span class="who ${w}">${w}</span>` : ""; }
function ansBox(o) {
  return `<div class="aw${target === o.id ? " active" : ""}" data-aw="${o.id}"><textarea class="ans" rows="1" data-id="${o.id}" data-k="answer" placeholder="답변 · 눌러서 여기에 받아쓰기">${esc(o.answer)}</textarea><div class="live"></div></div>`;
}
function fuHTML(f, i) {
  return `<div class="fu" data-fu="${f.id}">
    <div class="meta"><span class="lbl">${f.no ? esc(f.no) + " 꼬리질문" : "↳ 꼬리질문"}</span>${whoBadge(f.who)}${f.added ? `<button class="x" type="button" data-del="${f.id}" title="이 꼬리질문 지우기">지우기</button>` : ""}</div>
    <textarea class="qt" rows="1" data-id="${f.id}" data-k="text" placeholder="꼬리질문 내용 (말로 하고 나중에 적어도 돼요)">${esc(f.text)}</textarea>
    ${ansBox(f)}
  </div>`;
}
function qHTML(it) {
  const me = $("me").value;
  return `<article class="q${it.done ? " done" : ""}${me && it.who === me ? " mine" : ""}" data-q="${it.id}">
    <div class="meta">${it.no ? `<span class="no">${esc(it.no)}</span>` : ""}${whoBadge(it.who)}${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}
      ${it.added ? `<button class="x" type="button" data-del="${it.id}">지우기</button>` : ""}
      <label class="chk"><input type="checkbox" data-done="${it.id}"${it.done ? " checked" : ""}> 물어봄</label></div>
    <textarea class="qt" rows="1" data-id="${it.id}" data-k="text" placeholder="질문 내용">${esc(it.text)}</textarea>
    ${ansBox(it)}
    ${it.fu.length ? `<div class="fus">${it.fu.map(fuHTML).join("")}</div>` : ""}
    <div class="actions"><button type="button" data-addfu="${it.id}">+ 꼬리질문</button></div>
  </article>`;
}
function render() {
  const c = C();
  const total = order().length, answered = c.sections.flatMap(s => s.items).filter(i => i.t === "q" && (i.done || i.answer)).length;
  const qs = c.sections.flatMap(s => s.items).filter(i => i.t === "q").length;
  $("main").innerHTML = `
    <div class="cand-h"><h1>${esc(nameOf(cur))}</h1><span>질문 ${answered}/${qs} 진행</span></div>
    <div class="help">답변 칸을 누르고 <b>받아쓰기 시작</b>을 누르면 그 칸에 적혀요. 받아쓰는 중에도 다른 칸을 누르면 거기로 옮겨가요.
      키보드: <kbd>↓</kbd> 다음 칸 · <kbd>↑</kbd> 이전 칸 · <kbd>F</kbd> 지금 질문에 꼬리질문 추가 · <kbd>D</kbd> 물어봄 체크 (글자 입력 중이 아닐 때).
      질문 내용도 눌러서 바로 고칠 수 있어요. 기록은 이 기기의 브라우저에 자동 저장돼요.</div>
    ${c.sections.map((s, si) => `<section class="sec"><h2>${esc(s.title)}</h2>
      ${s.items.map(it => it.t === "say" ? `<div class="say">${esc(it.text)}</div>` : qHTML(it)).join("")}
      <button class="addq" type="button" data-addq="${si}">+ 이 섹션에 질문 추가</button></section>`).join("")}
    <section class="sec memo"><h2>종합 메모</h2><textarea rows="4" data-memo="1" placeholder="인상, 강점, 우려되는 점, 점수 등">${esc(c.memo)}</textarea></section>
    <div class="foot"><button type="button" id="reset">이 지원자 기록 모두 지우기</button></div>`;
}
function rerenderKeep() {
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

/* ---------- 받아쓰기 대상 ---------- */
function setTarget(id, scroll) {
  target = id;
  document.querySelectorAll(".aw.active").forEach(e => e.classList.remove("active"));
  const aw = document.querySelector(`[data-aw="${id}"]`);
  if (aw) { aw.classList.add("active"); if (scroll) aw.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function move(d) {
  const o = order(); let i = o.indexOf(target);
  i = i < 0 ? 0 : Math.max(0, Math.min(o.length - 1, i + d));
  setTarget(o[i], true);
}
function addFu(qid) {
  const r = find(qid); if (!r) return;
  const q = r.parent || r.obj;
  const f = { id: newId(), no: null, who: $("me").value || null, text: "", answer: "", added: true };
  q.fu.push(f); save(); rerenderKeep(); setTarget(f.id, true);
  document.querySelector(`textarea[data-id="${f.id}"][data-k="text"]`)?.focus();
}

/* ---------- 이벤트 ---------- */
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) open(b.dataset.c); });
$("main").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.memo) { C().memo = t.value; save(); return; }
  if (t.dataset.id) { const r = find(t.dataset.id); if (r) { r.obj[t.dataset.k] = t.value; save(); } }
});
$("main").addEventListener("focusin", e => {
  const t = e.target;
  if (t.dataset.k === "answer") setTarget(t.dataset.id);
});
let resetArmed = false;
$("main").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.done) { const r = find(t.dataset.done); r.obj.done = t.checked; save(); t.closest(".q").classList.toggle("done", t.checked); return; }
  const b = t.closest("button"); if (!b) return;
  if (b.dataset.addfu) addFu(b.dataset.addfu);
  else if (b.dataset.addq) {
    const s = C().sections[+b.dataset.addq];
    const it = { id: newId(), t: "q", no: null, who: $("me").value || null, tag: null, text: "", answer: "", done: false, fu: [], added: true };
    s.items.push(it); save(); rerenderKeep(); setTarget(it.id, true);
    document.querySelector(`textarea[data-id="${it.id}"][data-k="text"]`)?.focus();
  } else if (b.dataset.del) {
    const r = find(b.dataset.del); if (!r) return;
    if (r.parent) r.parent.fu = r.parent.fu.filter(f => f.id !== r.obj.id);
    else r.sec.items = r.sec.items.filter(i => i.id !== r.obj.id);
    if (target === r.obj.id) target = null;
    save(); rerenderKeep();
  } else if (b.id === "reset") {
    if (!resetArmed) { resetArmed = true; b.textContent = "한 번 더 누르면 이 지원자 기록이 지워져요"; setTimeout(() => { resetArmed = false; b.textContent = "이 지원자 기록 모두 지우기"; }, 3500); return; }
    resetArmed = false; if (running) stop();
    S.cands[cur] = fresh(BASE.find(c => c.id === cur)); save(); target = null; render(); toast("기록을 지웠어요");
  }
});
$("me").addEventListener("change", () => { ls.set(MEKEY, $("me").value); rerenderKeep(); });
document.addEventListener("keydown", e => {
  if ($("app").hidden) return;
  const tag = e.target.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) {
    if (e.key === "Escape" && tag === "TEXTAREA") e.target.blur();
    return;
  }
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.code === "KeyF" && target) { e.preventDefault(); addFu(target); }
  else if (e.code === "KeyD" && target) {
    const r = find(target); const q = r && (r.parent || r.obj); if (!q) return;
    q.done = !q.done; save(); rerenderKeep(); setTarget(target);
  }
});

/* ---------- 음성 인식 ---------- */
function showErr(m) { $("err").textContent = m; $("err").hidden = !m; }
function setStatus(on, txt) {
  $("status").classList.toggle("on-air", on); $("status-t").textContent = txt;
  $("rec").classList.toggle("on", on); $("rec").textContent = on ? "■ 멈추기" : "● 받아쓰기 시작";
}
function liveEl() { return target ? document.querySelector(`[data-aw="${target}"] .live`) : null; }
function addFinal(text) {
  text = text.trim(); if (!text || !target) return;
  const r = find(target); if (!r) return;
  r.obj.answer = r.obj.answer ? r.obj.answer + " " + text : text;
  const q = r.parent || r.obj; q.done = true;
  save();
  const ta = document.querySelector(`textarea[data-id="${target}"][data-k="answer"]`);
  if (ta) { ta.value = r.obj.answer; }
  const card = document.querySelector(`[data-q="${q.id}"]`);
  if (card) { card.classList.add("done"); const cb = card.querySelector("[data-done]"); if (cb) cb.checked = true; }
  const l = liveEl(); if (l) l.textContent = "";
}
function start() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showErr("이 브라우저는 음성 인식을 지원하지 않아요. 노트북의 크롬이나 사파리로 열어주세요."); return; }
  if (!target) { const o = order(); const first = o.find(id => !find(id).obj.answer) || o[0]; setTarget(first, true); }
  if (!C().startedAt) { C().startedAt = Date.now(); save(); }
  recog = new SR(); recog.lang = "ko-KR"; recog.continuous = true; recog.interimResults = true;
  recog.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) addFinal(r[0].transcript); else interim += r[0].transcript;
    }
    const l = liveEl(); if (l) l.textContent = interim;
  };
  recog.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      running = false; setStatus(false, "마이크 막힘");
      showErr("마이크 권한이 막혀 있어요. 주소창 왼쪽 아이콘에서 마이크를 허용한 뒤 다시 눌러주세요.");
    } else if (e.error === "network") showErr("인터넷이 끊겨 인식이 멈췄어요. 연결되면 다시 이어서 적어요.");
  };
  recog.onend = () => { if (running) { try { recog.start(); } catch {} } };
  running = true; showErr("");
  try { recog.start(); } catch {}
  setStatus(true, "듣는 중");
}
function stop() {
  running = false; if (recog) recog.stop();
  document.querySelectorAll(".live").forEach(l => l.textContent = "");
  setStatus(false, "멈춤");
}
$("rec").onclick = () => running ? stop() : start();

function tick() {
  const s = C()?.startedAt;
  if (!s) { $("timer").textContent = "00:00"; return; }
  const sec = Math.floor((Date.now() - s) / 1000);
  $("timer").textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
}

/* ---------- 내보내기 · 합치기 ---------- */
function asText(cid) {
  const c = S.cands[cid]; const out = [`멋쟁이사자처럼 15기 운영진 면접 기록 · ${nameOf(cid)}`];
  if (c.startedAt) out.push(`면접 시작: ${new Date(c.startedAt).toLocaleString("ko-KR")}`);
  c.sections.forEach(s => {
    const qs = s.items.filter(i => i.t === "q"); if (!qs.length) return;
    out.push("", `[${s.title}]`);
    qs.forEach(q => {
      out.push("", `${q.no ? q.no + ". " : ""}${q.who ? "(" + q.who + ") " : ""}${q.text}${q.done || q.answer ? "" : "  (안 물어봄)"}`);
      out.push(`→ ${q.answer || "-"}`);
      q.fu.forEach(f => { if (!f.text && !f.answer) return; out.push(`   ↳ ${f.no ? f.no + " " : ""}꼬리질문${f.who ? "(" + f.who + ")" : ""}: ${f.text || "(내용 없음)"}`, `   → ${f.answer || "-"}`); });
    });
  });
  out.push("", "[종합 메모]", c.memo || "-");
  return out.join("\n");
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const today = () => new Date().toISOString().slice(0, 10);
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(asText(cur)); toast("복사했어요"); } catch { toast("복사하지 못했어요. 텍스트 저장을 써주세요"); }
};
$("savetxt").onclick = () => download(`면접기록_${nameOf(cur)}_${today()}.txt`, asText(cur), "text/plain");
$("backup").onclick = () => download(`면접기록_전체_${$("me").value || "면접관"}_${today()}.json`, JSON.stringify({ app: "ll15", v: 1, by: $("me").value, cands: S.cands }, null, 1), "application/json");
$("importbtn").onclick = () => $("importfile").click();
$("importfile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch { toast("기록 파일을 읽지 못했어요"); return; }
  if (data.app !== "ll15" || !data.cands) { toast("이 페이지에서 내보낸 기록 파일이 아니에요"); return; }
  const tagBy = data.by ? `[${data.by}] ` : "[다른 면접관] ";
  const mergeText = (mine, theirs) => !theirs || mine === theirs || (mine || "").includes(theirs) ? mine : (mine ? mine + "\n" + tagBy + theirs : theirs);
  let n = 0;
  for (const [cid, tc] of Object.entries(data.cands)) {
    const mc = S.cands[cid]; if (!mc) continue;
    const prev = cur; cur = cid;
    tc.sections.forEach((ts, si) => ts.items.forEach(ti => {
      if (ti.t !== "q") return;
      let r = find(ti.id);
      if (!r) { if (mc.sections[si]) { mc.sections[si].items.push(clone(ti)); n++; } return; }
      const q = r.obj;
      const before = q.answer; q.answer = mergeText(q.answer, ti.answer); if (q.answer !== before) n++;
      q.done = q.done || ti.done;
      ti.fu.forEach(tf => {
        const mf = q.fu.find(f => f.id === tf.id);
        if (!mf) { q.fu.push(clone(tf)); n++; }
        else { const b = mf.answer; mf.answer = mergeText(mf.answer, tf.answer); if (mf.answer !== b) n++; if (!mf.text && tf.text) mf.text = tf.text; }
      });
    }));
    const bm = mc.memo; mc.memo = mergeText(mc.memo, tc.memo); if (mc.memo !== bm) n++;
    if (!mc.startedAt && tc.startedAt) mc.startedAt = tc.startedAt;
    cur = prev;
  }
  save(); rerenderKeep(); toast(n ? `${n}곳에 다른 면접관 기록을 합쳤어요` : "새로 합칠 내용이 없었어요");
};

let toastT;
function toast(m) {
  let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200);
}

/* 기억된 비밀번호가 있으면 바로 열기 */
(async () => { const pw = ls.get(PWKEY); if (pw && !await tryUnlock(pw, true)) ls.del(PWKEY); })();
</script>
