<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>면접 받아쓰기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 위 조작줄(고정) → 받아쓰기 기록(질문/답변 블록) → 지금 듣는 중인 글자 */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#1a2230; --muted:#5d6878; --line:#dce2ea;
  --q:#2f5fb3; --q-soft:#e6eefb; --a:#1f7a5a; --a-soft:#e2f3ec; --rec:#c43c3c; --rec-soft:#fbe6e6;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161c; --surface:#1a2029; --fg:#e5eaf1; --muted:#97a2b2; --line:#2b3340;
  --q:#7fa6f0; --q-soft:#1d2a42; --a:#6cc9a3; --a-soft:#17302a; --rec:#ef7d7d; --rec-soft:#3a1e1f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.65}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0 12px 0 0;font-weight:700}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--q);outline-offset:2px}
#rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700}
#rec.on{background:var(--rec-soft);color:var(--rec)}
.who{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.who button{border:0;border-radius:0;background:transparent}
.who button[aria-pressed="true"].q{background:var(--q);color:#fff}
.who button[aria-pressed="true"].a{background:var(--a);color:#fff}
.spacer{flex:1}
.status{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.on-air .dot{background:var(--rec);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.on-air .dot{animation:none}}
main{max-width:900px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:12px}
.help{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px 16px}
.help kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--bg)}
.blk{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--q);border-radius:8px;padding:10px 14px;display:grid;gap:2px}
.blk.a{border-left-color:var(--a)}
.blk .meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.tag{font-weight:600;color:var(--q)}
.blk.a .tag{color:var(--a)}
.blk .txt{outline:none;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.blk .txt:focus{background:var(--bg);border-radius:4px}
.del{margin-left:auto;font-size:12px;padding:2px 8px;border:0;background:transparent;color:var(--muted)}
.live{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.err{color:var(--rec);font-size:14px}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <h1>면접 받아쓰기</h1>
  <button id="rec" type="button">● 받아쓰기 시작</button>
  <div class="who" role="group" aria-label="지금 말하는 사람">
    <button id="who-q" class="q" type="button" aria-pressed="false">질문</button>
    <button id="who-a" class="a" type="button" aria-pressed="true">답변</button>
  </div>
  <span class="spacer"></span>
  <span class="status" id="status"><span class="dot"></span><span id="status-t">대기 중</span></span>
  <button id="copy" type="button">복사</button>
  <button id="save" type="button">텍스트 저장</button>
  <button id="clear" type="button">새로 시작</button>
</div></div>

<main>
  <div class="help" id="help">
    <b>받아쓰기 시작</b>을 누르고 마이크를 허용하면 말하는 대로 바로 적혀요.
    <kbd>1</kbd> 질문 · <kbd>2</kbd> 답변으로 바꾸면 거기서부터 새 칸에 적혀요. 적힌 글자는 눌러서 바로 고칠 수 있어요.
    기록은 이 브라우저에 자동 저장돼서 창을 닫았다 열어도 남아 있어요.
    <div class="err" id="err" hidden></div>
  </div>
  <div id="log"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = "interview-log-v1";
let blocks = [];           // {who:'q'|'a', time:'HH:MM:SS', text}
let who = "a";
let running = false, recog = null, liveEl = null;

const load = () => { try { blocks = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { blocks = []; } };
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(blocks)); } catch {} };
const now = () => new Date().toTimeString().slice(0, 8);
const label = w => w === "q" ? "질문" : "답변";

function render() {
  const log = $("log");
  log.innerHTML = "";
  if (!blocks.length && !running) { log.innerHTML = '<p class="empty">아직 적힌 내용이 없어요.</p>'; }
  blocks.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "blk " + b.who;
    el.innerHTML = `<div class="meta"><span class="tag">${label(b.who)}</span><span>${b.time}</span><button class="del" type="button">삭제</button></div><div class="txt" contenteditable="true"></div>`;
    const t = el.querySelector(".txt");
    t.textContent = b.text;
    t.addEventListener("input", () => { b.text = t.textContent; persist(); });
    el.querySelector(".del").onclick = () => { blocks.splice(i, 1); persist(); render(); };
    log.appendChild(el);
  });
  liveEl = document.createElement("div");
  liveEl.className = "live";
  log.appendChild(liveEl);
}

function current() {
  // 마지막 칸이 같은 사람이면 이어 쓰고, 아니면 새 칸
  let b = blocks[blocks.length - 1];
  if (!b || b.who !== who) { b = { who, time: now(), text: "" }; blocks.push(b); render(); }
  return b;
}

function addFinal(text) {
  text = text.trim();
  if (!text) return;
  const b = current();
  b.text = b.text ? b.text + " " + text : text;
  persist();
  const txts = document.querySelectorAll(".blk .txt");
  const t = txts[txts.length - 1];
  if (t && document.activeElement !== t) t.textContent = b.text;
  liveEl.textContent = "";
  window.scrollTo(0, document.body.scrollHeight);
}

function setWho(w) {
  who = w;
  $("who-q").setAttribute("aria-pressed", w === "q");
  $("who-a").setAttribute("aria-pressed", w === "a");
}

function showErr(msg) { $("err").textContent = msg; $("err").hidden = false; }

function setStatus(on, txt) {
  $("status").classList.toggle("on-air", on);
  $("status-t").textContent = txt;
  $("rec").classList.toggle("on", on);
  $("rec").textContent = on ? "■ 멈추기" : "● 받아쓰기 시작";
}

function start() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showErr("이 브라우저는 음성 인식을 지원하지 않아요. 크롬이나 사파리로 열어주세요."); return; }
  recog = new SR();
  recog.lang = "ko-KR";
  recog.continuous = true;
  recog.interimResults = true;
  recog.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) addFinal(r[0].transcript);
      else interim += r[0].transcript;
    }
    liveEl.textContent = interim ? `${label(who)} · ${interim}` : "";
  };
  recog.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      running = false; setStatus(false, "마이크 거부됨");
      showErr("마이크 권한이 막혀 있어요. 주소창 왼쪽 아이콘에서 마이크를 허용한 뒤 다시 눌러주세요.");
    } else if (e.error === "network") {
      showErr("인터넷 연결이 끊겨서 인식이 멈췄어요. 연결되면 자동으로 다시 시작해요.");
    }
  };
  // 크롬은 조용하면 저절로 끝나서, 켜져 있는 동안엔 바로 다시 시작
  recog.onend = () => { if (running) { try { recog.start(); } catch {} } };
  running = true;
  $("err").hidden = true;
  try { recog.start(); } catch {}
  setStatus(true, "듣는 중");
  render();
}

function stop() {
  running = false;
  if (recog) recog.stop();
  setStatus(false, "멈춤");
}

function asText() {
  return blocks.map(b => `[${b.time}] ${label(b.who)}: ${b.text}`).join("\n\n");
}

$("rec").onclick = () => running ? stop() : start();
$("who-q").onclick = () => setWho("q");
$("who-a").onclick = () => setWho("a");
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(asText()); $("copy").textContent = "복사됨"; }
  catch { $("copy").textContent = "복사 실패"; }
  setTimeout(() => $("copy").textContent = "복사", 1500);
};
$("save").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([asText()], { type: "text/plain" }));
  a.download = `면접기록_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
};
let armed = false;
$("clear").onclick = () => {
  if (!armed) { armed = true; $("clear").textContent = "한 번 더 누르면 지워져요"; setTimeout(() => { armed = false; $("clear").textContent = "새로 시작"; }, 3000); return; }
  armed = false; $("clear").textContent = "새로 시작";
  blocks = []; persist(); render();
};
document.addEventListener("keydown", e => {
  if (e.target.isContentEditable || e.metaKey || e.ctrlKey) return;
  if (e.key === "1") setWho("q");
  if (e.key === "2") setWho("a");
});

load(); render();
</script>
</body>
</html>
